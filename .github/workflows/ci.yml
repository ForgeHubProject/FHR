name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  node:
    name: Types, SDK & renderer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Build in dependency order first: typecheck resolves @fhr/types and
      # @fhr/renderer-sdk through their built .d.ts, and this also proves the
      # renderer bundle still bundles.
      - name: Build (types → sdk → renderer)
        run: |
          npm run build --workspace @fhr/types
          npm run build --workspace @fhr/renderer-sdk
          npm run build --workspace @fhr/renderer-gltf-scene

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

  go:
    name: Handler (native + wasm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/handler-gltf-scene
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/handler-gltf-scene/go.mod

      # Needed to execute the wasm test binary (see the wasm test step below).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Vet
        run: go vet -mod=mod ./...

      - name: Build (native)
        run: go build -mod=mod ./...

      - name: Test (native — subprocess build)
        run: go test -mod=mod ./...

      - name: Build (wasm — Tier B)
        env:
          GOOS: js
          GOARCH: wasm
        run: go build -mod=mod -o /tmp/handler-gltf-scene.wasm .

      # Parity: the same suite that guards the subprocess build runs against the
      # wasm build, under node, so the two entry points cannot drift.
      - name: Test (wasm — Tier B)
        env:
          GOOS: js
          GOARCH: wasm
        run: |
          # Go ships the wasm exec shim in lib/wasm (1.24+) or misc/wasm (older);
          # go test picks up go_js_wasm_exec from PATH.
          export PATH="$PATH:$(go env GOROOT)/lib/wasm:$(go env GOROOT)/misc/wasm"
          go test -mod=mod ./...
