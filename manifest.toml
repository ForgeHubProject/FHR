# FHR Official Source Manifest
# Fetched by: forge source add https://raw.githubusercontent.com/forgehubproject/fhr/main/manifest.toml

name        = "fhr-official"
url         = "https://github.com/forgehubproject/fhr"
description = "Official Forge Handler Repository"
maintainer  = "ForgeHub Project"

# ── Formats ───────────────────────────────────────────────────────────────────
# Each key is a file extension mapped to a handler name and the short commit
# SHA (build) at which that handler was last published. forge formats update
# compares this build field against the locally-recorded build to decide
# whether a re-download is needed.

[formats]
".gltf" = { handler = "gltf-scene", build = "9164e86" }
".glb"  = { handler = "gltf-scene", build = "9164e86" }
".csv"  = { handler = "csv", build = "9164e86" }
".ipynb" = { handler = "ipynb", build = "9778ef3" }
".obj"  = { handler = "obj", build = "9778ef3" }
".stl"  = { handler = "stl", build = "9778ef3" }
".ply"  = { handler = "ply", build = "9164e86" }
".3mf"  = { handler = "3mf", build = "9164e86" }
".off"  = { handler = "off", build = "9778ef3" }
".dae"  = { handler = "dae", build = "9778ef3" }
".x3d"  = { handler = "x3d", build = "9778ef3" }
".fbx"  = { handler = "fbx", build = "9164e86" }
".usd"  = { handler = "usd", build = "9164e86" }
".usda" = { handler = "usd", build = "9164e86" }
".usdc" = { handler = "usd", build = "9164e86" }
".usdz" = { handler = "usd", build = "9164e86" }
".3ds"  = { handler = "3ds", build = "9778ef3" }
".blend"  = { handler = "blend", build = "9778ef3" }
".amf"  = { handler = "amf", build = "9778ef3" }
".wrl"  = { handler = "vrml", build = "9778ef3" }
".dxf"  = { handler = "dxf", build = "9164e86" }
